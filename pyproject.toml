[project]
name = "finbot"
version = "0.2.0"
description = "Single-user personal finance Telegram bot (v1, v1.5, v2)"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot[job-queue]>=21.6,<23",
  "starlette>=0.37",
  "uvicorn>=0.30",
  "gspread>=6.1,<7",
  "google-auth>=2.30",
  "reportlab>=4.2",
  "httpx>=0.27",
  "anthropic>=0.40",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
